# Builds the container images, scans them, records what's inside (SBOM) and signs them.
# The cluster (Kyverno) only runs images signed by THIS workflow on main, so an image that
# fails the scan never gets signed and can never be deployed.
name: build

on:
  push:
    branches: [main]
    paths:
      - services/**
      - agent/**
      - .github/workflows/build.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GitHub Container Registry
  id-token: write # lets Cosign sign "keyless" with this workflow's identity

jobs:
  image:
    name: ${{ matrix.image }}:${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: shop
            context: services/shop
            tag: v1.3.2
            build-args: |
              APP_VERSION=v1.3.2
          # The deliberately broken release used to demo bad deploys and rollbacks.
          - image: shop
            context: services/shop
            tag: v1.4.0
            build-args: |
              APP_VERSION=v1.4.0
              BUG_CURRENCY_KEYERROR=true
          - image: sre-agent
            context: agent
            tag: "0.1.0"
            build-args: ""
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          build-args: ${{ matrix.build-args }}

      - name: Scan for critical vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1" # fail here = no signature = Kyverno blocks the image

      - name: Generate SBOM (software bill of materials)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@v3

      - name: Sign image and attach SBOM (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
