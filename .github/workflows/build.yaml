# Builds the container images, scans them, records what's inside (SBOM) and signs them.
# The cluster (Kyverno) only runs images signed by THIS workflow on main, so an image that
# fails the scan never gets signed and can never be deployed.
name: build

on:
  push:
    branches: [main]
    paths:
      - services/**
      - agent/**
      - .github/workflows/build.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to GitHub Container Registry
  id-token: write # lets Cosign sign "keyless" with this workflow's identity

jobs:
  image:
    name: ${{ matrix.image }}:${{ matrix.tag }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: shop
            context: services/shop
            tag: v1.3.2
            build-args: |
              APP_VERSION=v1.3.2
          # The deliberately broken release used to demo bad deploys and rollbacks.
          - image: shop
            context: services/shop
            tag: v1.4.0
            build-args: |
              APP_VERSION=v1.4.0
              BUG_CURRENCY_KEYERROR=true
          - image: sre-agent
            context: agent
            tag: "0.1.0"
            build-args: ""
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          build-args: ${{ matrix.build-args }}

      # Trivy is downloaded from its official release and checked against the published checksum,
      # instead of using a third-party action whose tags can change.
      - name: Install Trivy (checksum verified)
        env:
          TRIVY_VERSION: "0.75.0"
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -sSLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check
          tar xzf trivy.tar.gz trivy && sudo mv trivy /usr/local/bin/

      - name: Scan for critical vulnerabilities (Trivy)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        # Failing here = no signature = Kyverno will refuse to run the image.
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$REF"

      - name: Generate SBOM (software bill of materials)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image and attach SBOM (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
