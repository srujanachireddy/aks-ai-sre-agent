  namespace: demo
  severity: critical
  summary: checkout 5xx ratio 22%, fast burn rate 44x
  starts_at: "2026-10-26T11:32:00Z"
current: {image_tag: v1.3.2, replicas: 3, memory_limit_mi: 256}
expected:
