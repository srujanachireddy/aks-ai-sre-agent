[project]
name = "aks-ai-sre-agent"
version = "0.1.0"
description = "AI SRE agent: investigates Kubernetes incidents with read-only tools and proposes fixes as GitOps pull requests."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openai>=1.40",
  "mcp>=2.3,<3",
  "pyyaml>=6",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
kubernetes = ["kubernetes>=30"]
azure = ["azure-identity>=1.17"]
dev = ["pytest>=8"]

[project.scripts]
sre-agent-server = "sre_agent.server:main"
sre-agent-mcp = "sre_agent.mcp_server:main"
sre-agent-evals = "sre_agent.evals:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
