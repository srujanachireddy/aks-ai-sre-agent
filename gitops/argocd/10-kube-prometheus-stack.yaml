# Prometheus (metrics + alert rules), Alertmanager (routes alerts to the agent), Grafana (dashboards).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.3.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/gitops/platform/values/kube-prometheus-stack.yaml
    - repoURL: https://github.com/srujanachireddy/aks-ai-sre-agent.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # large CRDs exceed the client-side apply annotation limit
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
