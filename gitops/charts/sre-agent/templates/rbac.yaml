# The agent's Kubernetes identity. The annotation links it to an Azure managed identity
# (workload identity), which is allowed to call Azure OpenAI. No API keys are stored anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  annotations:
    azure.workload.identity/client-id: {{ .Values.azure.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.azure.tenantId | quote }}
---
# Read-only access to the shop namespace: exactly what the investigation tools need, nothing more.
# Note there is no create, update, patch or delete anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-readonly
  namespace: {{ .Values.targetNamespace }}
rules:
  - apiGroups: [""]
    resources: [pods, events, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [rollouts]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-readonly
  namespace: {{ .Values.targetNamespace }}
subjects:
  - kind: ServiceAccount
    name: sre-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent-readonly
