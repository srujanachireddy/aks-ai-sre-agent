# Loki 7.3.0 as a single pod with a disk. Production would use object storage (Azure Blob) and more replicas.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
minio: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
