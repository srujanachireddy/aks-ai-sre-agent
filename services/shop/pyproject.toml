[project]
name = "shop"
version = "1.3.2"
description = "Demo shop (checkout, payments, catalog) with fault switches, for the AI SRE agent to watch."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "prometheus-client>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shop = "shop.app:main"
shop-loadgen = "shop.loadgen:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
